<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090714" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Secure payment · RELUSTT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="payment.css?v=2" />
  <script src="https://js.stripe.com/clover/stripe.js" defer></script>
  <script src="payment.js?v=2" defer></script>
</head>
<body>
  <a class="checkout-close" id="closeCheckout" href="/funnel?step=your-plan&amp;cancelled=1" aria-label="Return to your plan">×</a>
  <main class="checkout-container">
    <header class="checkout-hero">
      <a class="checkout-logo" href="/" aria-label="RELUSTT home">RELUSTT</a>
      <span class="checkout-star" aria-hidden="true"></span>
      <h1 class="checkout-eyebrow">Secure payment</h1>
      <span class="checkout-rule" aria-hidden="true"></span>
      <p class="checkout-total">In total today: <strong id="checkoutTotal">—</strong></p>
      <p class="checkout-renewal" id="checkoutRenewal"></p>
    </header>

    <section aria-label="Payment details" class="checkout-payment" id="checkoutPayment" aria-busy="true">
      <div class="checkout-loading" id="checkoutLoading" role="status">
        <span class="checkout-spinner" aria-hidden="true"></span>
        <span>Preparing your secure payment…</span>
      </div>
      <form id="paymentForm" hidden>
        <div id="expressCheckout" class="checkout-express" hidden>
          <div id="expressCheckoutElement"></div>
          <div class="checkout-divider">or pay by card</div>
        </div>
        <div id="paymentElement"></div>
        <div class="email-field">
          <label for="paymentEmail">Email address</label>
          <input id="paymentEmail" type="email" name="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required maxlength="254" />
        </div>
        <button class="checkout-submit" id="payButton" type="submit" disabled>
          <svg aria-hidden="true" width="16" height="18" viewBox="0 0 16 18" fill="none"><rect x="2" y="8" width="12" height="9" rx="2" fill="currentColor"/><path d="M5 8V5a3 3 0 0 1 6 0v3" stroke="currentColor" stroke-width="2"/></svg>
          <span id="payButtonText">Unlock my plan</span>
        </button>
        <p class="checkout-terms">By paying, you agree to the <a href="/terms" target="_blank" rel="noopener noreferrer">Terms</a> and <a href="/privacy" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.</p>
      </form>
      <p class="checkout-error" id="checkoutError" role="alert" hidden></p>
      <button class="checkout-retry" id="retryButton" type="button" hidden>Try loading again</button>
    </section>

    <footer class="checkout-footer">
      <p class="trust-row"><svg aria-hidden="true" width="13" height="15" viewBox="0 0 16 18" fill="none"><rect x="2" y="8" width="12" height="9" rx="2" fill="currentColor"/><path d="M5 8V5a3 3 0 0 1 6 0v3" stroke="currentColor" stroke-width="2"/></svg> Secure payment powered by Stripe</p>
      <div class="trust-badges" aria-label="Visa, Mastercard, American Express. Processed by Stripe.">
        <span class="badge badge-visa">VISA</span><span class="badge badge-mc">MC</span><span class="badge badge-amex">AMEX</span><span class="badge badge-stripe">stripe</span>
      </div>
      <p class="checkout-next">After payment, connect Apple or Google to access RELUSTT.</p>
    </footer>
    <noscript>JavaScript is required for secure payment. Please enable it and reload this page.</noscript>
  </main>
</body>
</html>
